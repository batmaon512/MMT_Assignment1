# proxy_local.conf
# Proxy config cho benchmark tren localhost
# 
# Proxy chay tren port 8080, forward den:
#   - coroutine backend: 127.0.0.1:9011
#   - threading backend: 127.0.0.1:9010

# Truy cap qua Host: localhost:8080 → forward den coroutine server
host "127.0.0.1:8080" {
    proxy_pass http://127.0.0.1:9011;
}

# Virtual host rieng cho coroutine
host "coroutine.local" {
    proxy_pass http://127.0.0.1:9011;
    dist_policy round-robin
}

# Virtual host rieng cho threading
host "threading.local" {
    proxy_pass http://127.0.0.1:9010;
    dist_policy round-robin
}
